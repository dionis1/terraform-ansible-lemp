#cloud-config

hostname: lemp-server
manage_etc_hosts: true

users:
  - name: devops
    groups:
      - sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICbZF4t9H0JIxCQJzlb1EzAQc2e548VMynYlKx7hfUc3 terraform-lemp

ssh_pwauth: false

package_update: true

packages:
  - qemu-guest-agent
  - curl
  - ca-certificates

runcmd:
  - systemctl enable --now qemu-guest-agent
