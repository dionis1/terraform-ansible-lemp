#cloud-config

hostname: ${jsonencode(vm_name)}
manage_etc_hosts: true

users:
  - name: devops
    groups:
      - sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${jsonencode(ssh_public_key)}

ssh_pwauth: false

package_update: true

packages:
  - qemu-guest-agent
  - curl
  - ca-certificates

runcmd:
  - systemctl enable --now qemu-guest-agent

# Expand the root partition and filesystem on first boot.
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true
